name: Build

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:
  create:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jidicula/clang-format-action@v4.18.0
        with:
          clang-format-version: "17"
          fallback-style: google
  #      Disable clang-tidy for now
  #      - name: Get clang-tidy
  #        run: |
  #          apt-get update
  #          apt-get install -y clang-tidy
  #      - uses: ZehMatt/clang-tidy-annotations@v1.0.0
  #        with:
  #          build_dir: 'build'
  #          cmake_args: '-G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++'

  verify:
    # Everything VERIFY.sh covers: the I2SPI chain simulation against the real bus
    # sources, numeric checks on the docs, board-config generation and chain/pin rules,
    # the ATtiny node firmware in every build variant, and the I2C address map. Then the
    # exhaustive topology sweep (3^15 chain configurations, about two and a half minutes).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ gcc-avr avr-libc
          python -m pip install jsonschema==4.22.0

      - name: VERIFY.sh
        run: ./VERIFY.sh

      - name: Exhaustive topology sweep
        run: sim/sweep.sh

  qemu-s3:
    # The firmware on an emulated ESP32-S3 SuperMini (HelaFaye/qemu_esp32, pinned in
    # qemu/QEMU_ESP32): two I2C IMUs streaming to a stand-in server, then nine I2SPI
    # configurations and faults with emulated nodes and SPI IMUs. See qemu/README.md.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/cache@v6
        id: qemu-cache
        with:
          path: ${{ runner.temp }}/qemu-s3/qemu-dist
          key: qemu-esp32-${{ hashFiles('qemu/QEMU_ESP32') }}

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libglib2.0-dev libpixman-1-dev libgcrypt20-dev libslirp-dev flex bison
          python -m pip install --upgrade platformio esptool

      - name: Build QEMU
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: S3_CHECKS=none qemu/s3.sh "$RUNNER_TEMP/qemu-s3"

      - name: Build and check
        env:
          QEMU_XTENSA: ${{ runner.temp }}/qemu-s3/qemu-dist/qemu-system-xtensa
          QEMU_BIOS: ${{ runner.temp }}/qemu-s3/qemu-dist/bios
        run: qemu/s3.sh "$RUNNER_TEMP/qemu-s3"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qemu-s3-logs
          path: ${{ runner.temp }}/qemu-s3/run

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - name: Get tags
        run: git fetch --tags origin --recurse-submodules=no --force

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO and its dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Run builds
        run: python ./ci/build.py

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: ./build/*.bin

      - name: Upload to draft release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          generate_release_notes: true
          files: |
            ./build/BOARD_SLIMEVR-firmware.bin
            ./build/BOARD_SLIMEVR_V1_2-firmware.bin
