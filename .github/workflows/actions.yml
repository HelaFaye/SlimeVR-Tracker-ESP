name: Build

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:
  create:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jidicula/clang-format-action@v4.18.0
        with:
          clang-format-version: "17"
          fallback-style: google
  #      Disable clang-tidy for now
  #      - name: Get clang-tidy
  #        run: |
  #          apt-get update
  #          apt-get install -y clang-tidy
  #      - uses: ZehMatt/clang-tidy-annotations@v1.0.0
  #        with:
  #          build_dir: 'build'
  #          cmake_args: '-G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++'

  verify:
    # Everything VERIFY.sh covers: the I2SPI chain simulation against the real bus
    # sources, numeric checks on the docs, board-config generation and chain/pin rules,
    # the ATtiny node firmware in every build variant, and the I2C address map. Then the
    # exhaustive topology sweep (3^15 chain configurations, about two and a half minutes).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ gcc-avr avr-libc
          python -m pip install jsonschema==4.22.0

      - name: VERIFY.sh
        run: ./VERIFY.sh

      - name: Exhaustive topology sweep
        run: sim/sweep.sh

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - name: Get tags
        run: git fetch --tags origin --recurse-submodules=no --force

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PlatformIO and its dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Run builds
        run: python ./ci/build.py

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: ./build/*.bin

      - name: Upload to draft release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          generate_release_notes: true
          files: |
            ./build/BOARD_SLIMEVR-firmware.bin
            ./build/BOARD_SLIMEVR_V1_2-firmware.bin
