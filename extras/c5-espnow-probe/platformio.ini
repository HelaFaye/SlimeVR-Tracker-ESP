; ESP-NOW channel probe for the ESP32-C5 hub question (docs/dev/E22-AND-C5-HUB.md §5).
; Same pinned pioarduino release as the tracker's C5 boards. See README.md.
[env:probe]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
