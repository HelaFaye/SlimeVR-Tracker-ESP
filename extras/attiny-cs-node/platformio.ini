; Chip-select node firmware for a SlimeVR RJ45 SPI sensor chain.
;
; One image per node id - the id is compiled in rather than strapped, so the node board
; needs no jumpers. Label the boards.
;
;   pio run -e node1 -t upload
;
; Flashing is over UPDI (single wire). A cheap serial adapter with a 4.7k resistor in the
; TX line works as a UPDI programmer (SerialUPDI); set upload_port to your adapter.

[platformio]
default_envs = node1

[env]
platform = atmelmegaavr
framework = arduino
board = ATtiny412
board_build.f_cpu = 20000000L
; The protocol constants are shared verbatim with the tracker firmware so the two can't
; drift apart.
build_flags =
  -I../../src/sensorinterface
  -DBASE_ADDRESS=0x30
  -std=gnu++17
build_unflags = -std=gnu++11
upload_protocol = serialupdi
upload_speed = 230400
;upload_port = /dev/ttyUSB0

[env:node1]
build_flags = ${env.build_flags} -DNODE_ID=1

[env:node2]
build_flags = ${env.build_flags} -DNODE_ID=2

[env:node3]
build_flags = ${env.build_flags} -DNODE_ID=3

[env:node4]
build_flags = ${env.build_flags} -DNODE_ID=4

[env:node5]
build_flags = ${env.build_flags} -DNODE_ID=5

[env:node6]
build_flags = ${env.build_flags} -DNODE_ID=6

; Variant for parts without CCL (ATtiny85, ATtiny84, ...). An external 74LVC1G32 OR gate
; does the strobe gating instead: CS = CS_STROBE OR ARMED_N. Electrically identical from
; the tracker's point of view. Change `board` to match the part you're using.
;[env:node1_gate]
;board = attiny85
;build_flags = ${env.build_flags} -DNODE_ID=1 -DEXTERNAL_CS_GATE
